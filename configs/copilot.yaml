# Copilot configuration — the single source for every threshold, tolerance,
# provider pick and default the Day-5 pipeline uses. Calibrated on
# evals/seed_cases.yaml; re-checked on the ~50-case Day-6 set.

router:
  t_policy_risk: 0.70     # policy_risk noul >= this -> decline (template, no writer)
  t_missing: 0.60         # missing_inputs noul >= this -> one clarifying question
  t_confidence: 0.50      # intent choice confidence < this -> redirect
  t_oos_confidence: 0.90  # out_of_scope confidence >= this -> redirect without asking;
                          # below it the gate falls through to the clarify check first
                          # (calibrated: campaign_clarify oos 0.86 -> clarify,
                          #  ambiguous_campaign oos 0.96 -> redirect)

planner:
  default_depth: 0.30     # targeting depth when no budget is stated
  max_depth: 0.50         # budget-derived depth is capped here (k_max, as in notebook 04)
  default_mde: 0.01       # +1pp on the visit rate for test design
  default_daily_eligible: 2000   # customers/day seen in notebook 04's power sizing

validator:
  rel_tolerance: 0.01     # a cited number matches a tool value within 1% relative
  max_rewrites: 1         # one rewrite with the validator errors, then UNVERIFIED
  allowed_constants: [95] # the "95%" confidence level itself may be cited

writer:
  provider: ollama        # template | ollama | neurometric (flip for ablation)
  timeout_s: 60
  ollama_base_url: "http://localhost:11434"  # server root; the writer appends /v1
  ollama_model: "gpt-oss:120b-cloud"
  neurometric_model: "neurometric/goal-setter"

prompts:
  prompt_version: v2      # stamped into the trace; bump when prompts change
                          # v2: anti-derivation rule (no derived shares/relative CI)
                          # after live pass@1 findings, notebook 05

trace:
  enabled: true           # one JSONL row per stage under traces/ (git-ignored)
  dir: "traces"

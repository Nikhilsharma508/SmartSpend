# Business assumptions for UpliftIQ.
# Every figure here must also appear in the brief's "assumptions" section.
# Decided on Day 1 (rationale: notebook 02 §4). Change only with a recorded reason.

currency:
  reporting: USD          # USD only (decided): Hillstrom spend is already USD
  source: USD

hillstrom:
  # Margin applied to incremental spend to get gross profit.
  margin_rate: 0.30       # 30% retail gross-margin placeholder (assumption, not observed)

  # Cost of sending one marketing e-mail / contacting one customer.
  cost_per_contact_usd: 0.10   # assumed per-send cost

  # Value of one conversion, used by the conversion-route profit formula
  # profit = v * Δconv − c * n. $116.36 mean spend per Hillstrom converter x margin_rate.
  value_per_conversion_usd: 34.91

  # Default arm for the binary experiment, chosen on Day 1 from observed lift.
  binary_arm: mens        # Mens vs No E-Mail (Mens beats Womens on every outcome)

# Defaults used by the copilot when the marketer does not state a value.
# Anything filled from here must be flagged as an assumption in the brief.
copilot_defaults:
  budget_usd: 10_000
  cost_per_contact_usd: 0.10
  value_per_conversion_usd: null   # falls back to margin * spend if null

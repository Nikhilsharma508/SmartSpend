name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy packages pipelines
      - name: Fetch Hillstrom (optional; tests skip if unavailable)
        run: uv run python pipelines/download.py --fetch
        continue-on-error: true
      - name: Tests
        run: uv run pytest
